# Nova_Stats CI: the whole local suite (python3 tests/run_suite.py, about 1 minute) on every pull request and on
# pushes to main. The job `suite` is the gate. NovaLang itself is vendored in novalang/, so nothing is
# installed: Python 3 is all the suite needs.
#
# Actions are pinned to commit SHAs (the tag is in the trailing comment); Dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONFAULTHANDLER: "1"
  NOVALANG_CACHE: "off"

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the suite
        run: python3 tests/run_suite.py
