# Nova_Stats CI on every pull request and on pushes to main. Nova_Stats reads macOS system commands
# (top, vm_stat, ioreg, pmset, sysctl), so the whole suite (python3 tests/run_suite.py, with the live
# host smoke test) runs on macOS; Linux runs the portable part, the NovaLang tests on the VM and on
# the self-hosted engine, which replay recorded command output and need no Mac. NovaLang itself is vendored in novalang/, so nothing is
# installed: Python 3 is all the suite needs.
#
# Actions are pinned to commit SHAs (the tag is in the trailing comment); Dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONFAULTHANDLER: "1"
  NOVALANG_CACHE: "off"

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the suite
        run: python3 tests/run_suite.py

  novalang-linux:
    name: NovaLang tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: NovaLang tests on the bytecode VM
        run: python3 novalang/novalang.py tests/run_tests.nova | tee vm.txt && grep -q " 0 failed" vm.txt
      - name: NovaLang tests on the self-hosted engine
        run: python3 novalang/novalang.py --bootstrap tests/run_tests.nova | tee boot.txt && grep -q " 0 failed" boot.txt
      - name: Chaos test (each system command missing or blank; replayed, so no Mac needed)
        run: python3 -m unittest tests.test_chaos -v
